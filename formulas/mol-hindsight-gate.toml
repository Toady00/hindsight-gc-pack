description = """
Record a human gate decision on a document and ship the result.

The gate itself is conversational — the founder reads a doc and says it
looks good (or sends it back). This formula is the scribe half: it applies
the decision to the doc's frontmatter, commits, and syncs the bank. It
NEVER decides; it records a decision already made. The bead carrying this
formula must state who approved and where (mail id, session, or verbatim
quote) so the approval event is auditable.

On approve: status -> accepted, source -> human, updated_at bumped.
On reject: status stays/returns to draft; feedback lands in bead notes for
the authoring agent. Either way the doc ships, because drafts ship too —
status tags, not shipping timing, distinguish committed truth from work in
flight.
"""
formula = "mol-hindsight-gate"
version = "0.1.0"

[vars]

[vars.doc_path]
description = "Path to the markdown doc being gated (repo-relative or absolute)"

[vars.verdict]
description = "The human's decision: 'approve' or 'reject'"

[vars.approved_by]
description = "Who passed the gate and where it happened (e.g. 'founder, via mail msg-123')"

[vars.bank]
description = "Hindsight bank id"
default = "stacked-chips-v2"

[[steps]]
id = "verify-provenance"
title = "Verify the gate actually happened"
description = """
Confirm the bead records a real approval event: {{approved_by}} must name a
person and a traceable venue (mail message, session, quoted instruction).
If the provenance is missing or vague, stop and mail the sender — never
flip a gate on inference. Read {{doc_path}} and confirm its frontmatter is
contract-valid (id, type, status, source, scope present; vocabulary
values legal).
"""

[[steps]]
id = "apply-decision"
title = "Apply the decision to frontmatter"
needs = ["verify-provenance"]
description = """
For verdict 'approve': set `status: accepted`, set `source: human`, bump
`updated_at` to now (ISO 8601 UTC). For verdict 'reject': ensure
`status: draft` (revert it if something optimistically set accepted), leave
`source` as is, bump `updated_at`, and copy the rejection feedback into the
bead notes for the authoring agent to pick up. Edit only frontmatter —
gate decisions never alter document content.
"""

[[steps]]
id = "commit"
title = "Commit the change"
needs = ["apply-decision"]
description = """
Commit the frontmatter change in the doc's repo with a signed commit
(gpg signing on). Commit message: one line stating the gate result, e.g.
`docs: accept spec.eventing.transport.0002 (founder gate)`. Do not batch
unrelated changes into this commit.
"""

[[steps]]
id = "ship"
title = "Ship the gated doc"
needs = ["commit"]
description = """
Run {{.ConfigDir}}/assets/scripts/ship-docs.sh --bank {{bank}} against the
doc's docs root so the new status/source revision replaces the previous one
in the bank. Confirm the operation reaches 'completed'; on 'failed', read
error_message and mail the mayor rather than retrying blindly.
"""
