description = """
Nightly bank maintenance: audit first, consolidation as backstop.

The mechanical work is one deterministic script (bank-maintain.sh): drain
in-flight operations, consolidate with recover+retry, and a tag audit
(axis check, schema vocabulary, rig registry, domain vocab, case-split
and Levenshtein near-duplicate detection). The agent's job is only what a
script cannot decide: reading mental models for overreach, judging whether
findings are incidents, and escalating.

This job is NOT the freshness trigger. The bank runs with
enable_auto_consolidation on, so the server consolidates after retains on
its own; observations stay current without this order. The nightly value
is what no server-side process does — the audits (tag hygiene, config
drift, mental-model overreach) — plus an ensure-and-wait consolidation
pass that gives the audits a settled corpus and catches anything
auto-consolidation missed (e.g. after it was suspended for a bulk load).

This root is the complete executable task; there are no child step beads.
Execute the phases below in order, in one claimed archivist session. On a
maintenance failure, skip the model audit but always report the outcome before
closing the root. Do not abandon the report when a command exits nonzero.

## 1. Maintain

Run the maintenance script and capture its report in the bead notes:

    gc hindsight maintain

The bank comes from $HINDSIGHT_BANK (workspace env); the script fails
loudly if it is unset.

Branch on its exit code — the script has already done the work; do not
re-derive its steps by hand:

- 0: clean. Continue.
- 2: consolidated fine, tag audit has findings (listed on stdout, tagged
  UNKNOWN-AXIS / BAD-VALUE / UNKNOWN-RIG / NEW-DOMAIN / CASE-SPLIT /
  NEAR-DUP). Malformed or misspelled tags mean a writer bypassed the
  shipper — treat as an incident: identify the writer, mail the mayor with
  the finding lines. Fixes happen at the source (correct the doc, re-ship),
  never by editing memories. CONFIG-DRIFT or AUDIT-INCOMPLETE requires operator attention. NEW-DOMAIN alone may be legitimate vocabulary
  growth — judge before escalating.
- 3: drain timeout — operations still in flight; consolidation was not
  run. Stop maintenance and proceed to the report (the next nightly run will catch up);
  mail the mayor only if this is the second consecutive timeout.
  Inspect the reported operation IDs and live progress before describing work
  as stuck. Bank-wide waiting does not invalidate successful document receipts
  or justify repeating document reprocessing.
- 5: operation state or audit inventory could not be read reliably. Record
  the failure and mail the mayor; never report this as a clean night.
- 4: consolidation failed after recover+retry. Mail the mayor with the
  error output. Do not loop.

## 2. Model audit

Skip this phase unless maintain exited 0 or 2 (consolidation actually ran).

Create a scratch dir (`TMP=$(mktemp -d)`) — every API response lands under
it, reaped on reboot, never dumped raw into your context. For each id in
{{audit_models}}: fetch it
(`gc hindsight read -o json mental-model get "$HINDSIGHT_BANK" <id> > "$TMP/<id>.json"`),
read only `.content` via jq — a mental-model response can be 100x larger
than its readable content — and check its claims against what the corpus
establishes. Flag claims that name decisions, dates, or reaffirmations no
document made, or that promote a draft/voice-memo position to platform
fact. You are reading for overreach, not completeness. Mail the mayor only
if a model asserts something materially wrong.

## 3. Report

Write a terse summary to bead notes: the script's final status line
(drain/consolidate/audit_findings), and the model audit result (clean /
findings / skipped because maintenance failed). Mail the mayor only when something needs a human or coordinator
decision. A clean night closes silently.
Write the report to this root's notes before closing this root. If maintenance
or the model audit was incomplete, record that explicitly in both notes and the
close reason; closing the workflow does not declare the bank healthy.
Close as the claimed root's confirmed assignee using --actor, never --force.
After closing, run gc hook --claim --json and execute any next claimed task;
go idle only when no work is returned. Do not wait for an external reminder.
"""
formula = "mol-hindsight-consolidate"
version = "0.2.0"
phase = "vapor"

# Legacy poured children are excluded from controller demand. Keep all phases
# in this task root so queued work can wake and be claimed by the archivist.
[vars]

[vars.audit_models]
description = "Space-separated mental model ids to spot-audit this run (rotate over time)"
default = "conventions-and-standards landmines"
