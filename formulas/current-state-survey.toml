description = """
Survey a rig's codebase and publish its `current-state` document.

One surveyor works the steps in order inside a dedicated git worktree —
never the rig root checkout. The mechanical steps (worktree, frontmatter,
push/PR, cleanup) are the pack's `survey` command; the agent's judgment
goes into reading the code and writing `{{output_file}}`.

Publishing (`publish` var): `pr` pushes a survey branch and opens a
PR/MR for human review. `direct` pushes to the default branch. Both reach
the bank through normal Git ingestion after publication to the canonical
branch. All modes stamp `source: agent` and `status: draft`; review approval
is separate. `none` commits on the branch and keeps the worktree for
inspection. The scheduled order runs with the
defaults. For a local-only run use `gc formula cook current-state-survey
--rig <rig> --var publish=none`. This still creates work and a local commit;
it is not a read-only dry run. Verify `publish=none` in the persisted prepare
step before relying on it: older `gc order run` builds silently dropped
overrides. Do not cook a second run while a survey is active.

Cleanup is a teardown scope step: it runs after the worktree scope settles,
removes the worktree only when that scope passed and its commit is safely
on origin, and otherwise preserves it with the reason on the root bead.
"""
formula = "current-state-survey"
version = "0.1.0"

# gc.run_target must be the binding-qualified name: imported pack agents
# resolve only as <binding>.<name> (config.AgentMatchesIdentity), so this
# formula assumes the pack is imported as `hindsight`. Routing resolves the
# binding-qualified target in the order's rig context to <rig>/hindsight.surveyor.
# The order's `pool` is qualified for us and stays bare.

[requires]
formula_compiler = ">=2.0.0"

[vars]

[vars.output_file]
description = "Rig-relative file path of the survey document"
default = "docs/current-state.md"

[vars.publish]
description = "pr (branch + PR) | direct (push to default branch) | none (commit locally, keep worktree); all produce agent-authored drafts"
default = "pr"

[vars.pr_tool]
description = "auto (infer from origin host) | gh | glab"
default = "auto"

[[steps]]
id = "prepare-worktree"
title = "Prepare the survey worktree"
description_file = "../assets/workflows/current-state-survey/prepare-worktree.md"
metadata = { "gc.run_target" = "hindsight.surveyor", "gc.scope_ref" = "worktree", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "survey"
title = "Survey the codebase and write the document"
needs = ["prepare-worktree"]
description_file = "../assets/workflows/current-state-survey/survey.md"
metadata = { "gc.run_target" = "hindsight.surveyor", "gc.scope_ref" = "worktree", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "publish"
title = "Publish the survey"
needs = ["survey"]
description_file = "../assets/workflows/current-state-survey/publish.md"
metadata = { "gc.run_target" = "hindsight.surveyor", "gc.scope_ref" = "worktree", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "worktree"
title = "Worktree scope"
needs = ["publish"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "cleanup"
title = "Remove the survey worktree"
needs = ["worktree"]
description_file = "../assets/workflows/current-state-survey/cleanup.md"
metadata = { "gc.run_target" = "hindsight.surveyor", "gc.kind" = "cleanup", "gc.scope_ref" = "worktree", "gc.scope_role" = "teardown" }
