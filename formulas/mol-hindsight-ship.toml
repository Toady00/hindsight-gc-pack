description = """
Reconcile the platform's docs trees into the Hindsight memory bank.

Runs the pack's ship command: reads the committed content of every docs
root's canonical ref (origin/HEAD, falling back to local HEAD — never the
working tree, so branch switches and dirty checkouts cannot leak
unpublished content), validates frontmatter against the retain contract,
and ships every published doc whose content differs from the bank's copy.
The shipper is stateless — the bank is the ledger (each retain stamps a
content hash the differ reads back), so any machine computes the same
diff with nothing local to sync or lose. It drains in-flight bank
operations before shipping and polls its own operations to terminal. Over-shipping is harmless (document_id retains are idempotent);
missed shipping is the silent failure this formula exists to prevent.
Correctness lives in the script; this formula is a dumb trigger — one of
several. Humans and other formulas can run the same path at any time via
the pack's `ship` command (which also owns dry-run for manual previews;
this workflow always ships for real).
"""
formula = "mol-hindsight-ship"
version = "0.1.0"
phase = "vapor"

[vars]

[vars.docs_roots]
description = "Space-separated docs roots. Empty means auto: every rig's docs/ directory plus the city's own docs/ if present."
default = ""

[[steps]]
id = "ship-sync"
title = "Run the ship sync"
description = """
Run the pack's ship command:

    {{.ConfigDir}}/commands/ship/run.sh --fetch {{docs_roots}}

The bank comes from $HINDSIGHT_BANK (workspace env — every city
declares its own); the command fails loudly if it is unset.

(--fetch keeps each repo's origin/HEAD current before shipping, so a
quiet docs repo cannot ship stale-by-one-push content; a fetch failure
warns and ships as-fetched rather than blocking.)

With no roots it auto-resolves them (each rig's docs/ from `gc rig list`,
plus the city's own docs/) and prints the resolved list — keep that in the
bead notes so the run is auditable. The script refuses malformed docs
loudly (unknown type/status/source/scope, missing required fields) and
prints a per-doc report: SHIPPED, skipped (unchanged), REFUSED, FAILED,
plus GONE (in the bank but missing from the walk — deprecate-in-place was
violated somewhere). Do not edit docs to force them through — a refusal
is a finding, not an obstacle.
"""

[[steps]]
id = "report"
title = "Report outcomes"
needs = ["ship-sync"]
description = """
Summarize the run in the bead notes: counts of shipped / skipped / refused /
failed, and the specific doc ids for anything refused or failed. If any doc
FAILED extraction (operation status 'failed'), read the operation's
error_message, and mail the mayor with doc id + error. If docs were REFUSED
for frontmatter problems, mail the rig that owns them (or the mayor if
ownership is unclear) with the exact validation error. A clean run needs no
mail — close quietly.
"""
