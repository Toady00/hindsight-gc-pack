description = """
Reconcile the platform's docs trees into the Hindsight memory bank.

Runs gc hindsight ship against freshly fetched origin branches. The remote's
advertised HEAD selects the default; --ref selects a published branch. There is
no local HEAD, SHA or filesystem fallback. Only pushed content ships, including
drafts; branch switches and dirty checkouts are irrelevant. Every root must
belong to Git, including worktrees. Any fetch, tree-listing or blob-read failure
stops the entire scan before new retains.

The shared city Beads SQL store is the ledger, addressed explicitly through
GC_CITY_PATH. Durable hindsight-document and hindsight-bank records stay status
pinned, unassigned and unrouted. metadata.hindsight uses schema_version 1 and
api/bank/kind/document_id identity; its data holds document attempt/last_success/
source or bank latest_run/latest_full_scan/last_success. No local health journal
exists. A city-local ship lock prevents overlap after a session reset; it does
not coordinate separate cities. Keep one active archivist writer per bank.

The shipper drains bank operations, recovers original unresolved attempts with
bounded retry, and persists a UUID intent and payload before each retain POST.
Only confirmed completion records success. Payload snapshots leave current
metadata on success but remain in Dolt history. A bank hash alone cannot justify
skipping. Missing/unknown receipts need a reviewed dry-run followed by a real
scan to re-ingest once, not bootstrap from bank hashes. The server must advertise
RetainRequest operation_id and async in /openapi.json; the local v0.9.1/v0.9.2
servers used for the templates support this contract.

Correctness lives in the script. Humans and other formulas use the same
gc hindsight ship command, which queues work outside the archivist and owns
local --dry-run previews. This workflow runs real shipping requests.

This root is the complete executable task; there are no child step beads.
Execute the phases below in order, in one claimed archivist session. Always
report the outcome, including failures, before closing the root.

## 1. Ship sync

Run the pack's ship command:

    gc hindsight ship --request '{{request}}' --fetch {{docs_roots}}

The bank comes from $HINDSIGHT_BANK unless the encoded request selects --bank;
there is no default bank. Run in the foreground, one writer command at a time.

--fetch is accepted for existing callers but is now a no-op: every scan fetches
origin. A failed fetch blocks shipping, never uses stale content. --ref accepts
foo, origin/foo, refs/heads/foo or refs/remotes/origin/foo as published branches,
not local HEAD, commit SHAs or tags.

With no roots it includes each registered rig's docs/, even if absent from the
checkout, city docs/ if present, and HINDSIGHT_DOCS_ROOTS. All roots must belong
to Git; missing rig repositories fail, while docs absent from a fetched tree
are a valid empty inventory for GONE. Keep the resolved roots and commit SHAs
in the bead notes. Git source records contain stable repository identity,
relative path, branch and SHA. The script refuses malformed docs
loudly (unknown type/status/source/scope, missing required fields) and
prints per-doc SHIPPED, UNCHANGED, RECOVERED, REFUSED, FAILED and GONE findings.
GONE means missing from the fetched repository/path prefix, never permission
to delete bank content. Do not edit docs to force them through; a refusal is
a finding. Pushed drafts are visible; no accepted-source filters are added.

For --reprocess, retain completes before the server document reprocess call.
On exit 3, inspect receipts and live operation details before retrying: a bank
drain can time out on consolidation or mental-model refreshes after earlier
document work succeeded. Do not repeat --reprocess solely because of that wait;
follow the report phase's receipt checks even if shipping cannot complete.
The reprocess endpoint is not caller-idempotent. A lost acknowledgement leaves phase
reprocess_prepared and fails closed. Never blindly retry the POST or clear the
attempt. A human must inspect the operation list and repair
metadata.hindsight.data.attempt.reprocess_operation_id with the actual UUID and
metadata.hindsight.data.attempt.phase to reprocess_wait, preserving other state,
before an ordinary scan resumes recovery. This requests reprocessing, not a
verified guarantee of unchanged-chunk invalidation inside the server.

## 2. Report

Read `gc hindsight status --task <claimed-root-id>` using this root's actual ID.
Its document_receipts are confirmed successes attributed to this task, across
session resets; recent_scans lists up to 20 earlier scans plus the latest one.
Report those receipts separately from the last scan's counters. A running older
scan may have been interrupted; do not infer completion from its counters.
Summarize the run in the bead notes: counts of shipped / skipped / refused /
failed, and the specific doc ids for anything refused or failed. If any doc
FAILED extraction (operation status 'failed'), read the operation's
error_message, and mail the mayor with doc id + error. If docs were REFUSED
for frontmatter problems, mail the rig that owns them (or the mayor if
ownership is unclear) with the exact validation error. Record the shared bank
health bead ID printed by the shipper and whether this was a full or partial
scan. gc hindsight status reads shared Beads, not the live bank, and reports
freshness and unresolved attempts. Partial scans cannot refresh the full-scan
success timestamp; incomplete partial runs still make health unhealthy.
For exit 3, distinguish a bank drain timeout from a document-operation timeout.
A bank drain waits for all pending/processing operations, including consolidation
and mental-model refreshes; it does not establish a stuck document attempt.
Inspect the selected documents' last_success receipts and attempt states in the
city store, then fetch live operation details and extraction child results.
Report confirmed document completion separately from background bank readiness.
A later zero-shipped timeout scan does not negate earlier successful receipts.
Do not repeat --reprocess for documents with confirmed reprocess receipts merely
because the bank drain timed out. Use an ordinary scan to reconcile health after
background work settles. Never clear a durable attempt to bypass a timeout.
Escalate incomplete roots, failed fetches, GONE findings, and any stale full-scan
health alongside refusals and failures. Exit 5 means the run could not establish
complete state, including operation-list or inventory failures. A clean run
needs no mail; close quietly.
Write the report to this root's notes before closing this root. If shipping
was incomplete, record that explicitly in both notes and the close reason;
closing the workflow does not declare the bank healthy or retry any operation.
Close as the claimed root's confirmed assignee using --actor, never --force.
After closing, run gc hook --claim --json and execute any next claimed task;
go idle only when no work is returned. Do not wait for an external reminder.
"""
formula = "mol-hindsight-ship"
version = "0.2.0"
phase = "vapor"

# Legacy poured children are excluded from controller demand. Keep all phases
# in this task root so queued work can wake and be claimed by the archivist.
[vars]

[vars.request]
description = "Base64 JSON argv from the ship command. Empty means the scheduled scan."
default = ""

[vars.docs_roots]
description = "Space-separated Git docs roots. Empty means auto: every rig's docs/ even if absent from checkout, city docs/ if present, and HINDSIGHT_DOCS_ROOTS."
default = ""
