# Hindsight — platform memory pack.
#
# Gives a Gas City a shared Hindsight memory bank over the platform's
# authored documents: PRDs, specs, ADRs, conventions, surveys, gotchas.
# Agents read the bank to discover platform-wide direction from inside a
# single rig; the pack's archivist is the bank's only writer.
#
# example.bank-template.json is the importable starting point for a
# bank (missions, strategies, directives, the mental models the pack
# references). The retain contract's enforcement point is the schema
# (schemas/docs/derive); the skills carry the working references.
#
# Referenced by workspace.pack (the archivist is city-scoped). The one
# rig-scoped agent, the surveyor, is a scale-to-zero pool that only
# exists while a current-state survey is running; every other rig agent
# consumes the skills and calls the read patterns. Only the archivist
# writes to the bank.

[pack]
name = "hindsight"
schema = 2
version = "0.1.0"
description = "Shared platform memory on Hindsight: doc shipping, bank maintenance, and read patterns for agents"

# The archivist: single writer for the bank. City-scoped, woken by orders
# (scheduled ship sync, nightly consolidation) or by slinging the ship
# formula at it. max_active_sessions = 1 in its agent.toml is what
# structurally enforces the single-writer rule — do not raise it.
#
# Scope: this pack is the hindsight operator — shipping what the docs
# tree says and maintaining the bank — plus one producer it owns: the
# `current-state` survey (agents/surveyor, formulas/current-state-survey),
# because that doc type's id, strategy and frontmatter are defined by
# this pack's retain contract. All other doc creation and approval flows
# live in workflow packs that depend on this one; this pack never decides
# what to ship. The survey publishes through git (branch + PR by
# default), so it still reaches the bank only via the ordinary ship path.
[[named_session]]
template = "archivist"
scope = "city"
mode = "on_demand"
