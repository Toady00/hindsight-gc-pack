# Nightly audit + consolidation backstop. Not the freshness trigger:
# auto-consolidation is on, so the server consolidates after retains by
# itself. This order exists for the audits (tag hygiene, config drift,
# mental-model overreach — nothing server-side does those) with an
# ensure-and-wait consolidation pass so the audits see a settled corpus.
# Runs off-peak relative to the hourly ship-sync order; the formula's
# drain step keeps the two from overlapping a moving corpus.
[order]
description = "Nightly Hindsight audit (tags, config drift, mental models) + consolidation backstop"
scope = "city"
formula = "mol-hindsight-consolidate"
trigger = "cooldown"
interval = "24h"
pool = "archivist"
